<!DOCTYPE html>
<html>
<head>
    <title>3D Obby - Pure Blocky Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none; z-index: 5; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.6); color: white; cursor: pointer; font-size: 24px; z-index: 10; }
        #win-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: #ffd700; z-index: 20; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #00ff00; border: none; border-radius: 8px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <b>WASD</b> to Move | <b>SPACE</b> to Jump<br>
        <span id="status" style="color: #00ff00;">Checkpoint: Start</span>
    </div>
    
    <div id="overlay">CLICK TO START</div>

    <div id="win-screen">
        <h1>🏆 OBBY CONQUERED! 🏆</h1>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        scene.add(light);

        // =========================
        // BLOCKY MINECRAFT-STYLE HUMAN
        // SINGLE COLOR VERSION
        // =========================

        const player = new THREE.Group();

        const playerMat = new THREE.MeshStandardMaterial({
            color: 0xff0000 // CHANGE THIS COLOR
        });

        // HEAD
        const head = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            playerMat
        );

        head.position.y = 2.4;

        player.add(head);

        // BODY
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.0, 1.2, 0.5),
            playerMat
        );

        body.position.y = 1.4;

        player.add(body);

        // LEFT ARM
        const armL = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 1.1, 0.35),
            playerMat
        );

        armL.position.set(-0.7, 1.4, 0);

        player.add(armL);

        // RIGHT ARM
        const armR = new THREE.Mesh(
            new THREE.BoxGeometry(0.35, 1.1, 0.35),
            playerMat
        );

        armR.position.set(0.7, 1.4, 0);

        player.add(armR);

        // LEFT LEG
        const legL = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 1.1, 0.4),
            playerMat
        );

        legL.position.set(-0.25, 0.3, 0);

        player.add(legL);

        // RIGHT LEG
        const legR = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 1.1, 0.4),
            playerMat
        );

        legR.position.set(0.25, 0.3, 0);

        player.add(legR);

        // POSITION
        player.position.set(0, 5, 0);

        scene.add(player);

        // --- Controls State ---
        let yaw = 0, pitch = 0.3;
        const sensitivity = 0.008;
        let gameActive = true;

        const overlay = document.getElementById('overlay');
        const winScreen = document.getElementById('win-screen');

        overlay.addEventListener('click', () => { if(gameActive) document.body.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => {
            overlay.style.display = (document.pointerLockElement || !gameActive) ? "none" : "flex";
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && gameActive) {
                yaw -= e.movementX * sensitivity;
                pitch += e.movementY * sensitivity;
                pitch = Math.max(-0.6, Math.min(0.8, pitch));
            }
        });

        // --- World ---
        const platforms = [];
        const lasers = [];
        let checkpointPos = new THREE.Vector3(0, 5, 0);

        function createPart(x, y, z, w, d, isCheckpoint = false, isGoal = false) {
            const h = 3.0; 
            const mat = new THREE.MeshStandardMaterial({ 
                color: isCheckpoint ? 0x00ff00 : (isGoal ? 0xffd700 : 0xffffff) 
            });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            mesh.position.set(x, y, z);
            mesh.userData = { isCheckpoint, isGoal, h, w, d };
            scene.add(mesh);
            platforms.push(mesh);
        }

        function createLaser(x, y, z, width, offset) {
            const laser = new THREE.Mesh(
                new THREE.BoxGeometry(width, 0.4, 0.4), 
                new THREE.MeshBasicMaterial({ color: 0xff0000 })
            );
            laser.position.set(x, y, z);
            laser.userData = { startX: x, offset: offset, range: 10 };
            scene.add(laser);
            lasers.push(laser);
        }

        // Map Setup
        createPart(0, 0, 0, 15, 15, true);      
        createPart(0, 1.5, -22, 10, 10);
        createPart(18, 3, -22, 10, 10);
        createPart(35, 4.5, -22, 15, 15, true);  

        for(let i=0; i<6; i++) {
            createPart(35 + (i%2 === 0 ? 12 : -12), 6 + (i*1.8), -40 - (i*16), 10, 10);
        }
        createPart(35, 18, -150, 20, 20, true); 

        for(let i=0; i<5; i++) {
            createPart(35, 20 + (i * 2), -180 - (i * 14), 18, 6);
        }
        createPart(35, 32, -260, 20, 20, true);

        createPart(35, 32, -310, 15, 80);
        for(let i=0; i<6; i++) {
            createLaser(35, 34, -280 - (i*10), 14, i);
        }
        createPart(35, 32, -370, 30, 30, false, true); 

        // --- Gameplay Mechanics ---
        const keys = {};
        let velocityY = 0;
        const gravity = -0.016;
        let canJump = false;

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        window.restartGame = function() {
            player.position.set(0, 5, 0);
            checkpointPos.set(0, 5, 0);
            velocityY = 0; yaw = 0; pitch = 0.3;
            gameActive = true;
            winScreen.style.display = "none";
            document.getElementById('status').innerText = "Checkpoint: Start";
            document.body.requestPointerLock();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(!gameActive) return;

            // Movement
            player.rotation.y = yaw;
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;

            if (moveDir.length() > 0) {
                moveDir.normalize();
                const direction = moveDir.applyQuaternion(player.quaternion);
                player.position.x += direction.x * 0.35;
                player.position.z += direction.z * 0.35;
                
                // Animation
                const t = Date.now() * 0.012;
                armL.rotation.x = Math.sin(t) * 1; armR.rotation.x = -Math.sin(t) * 1;
                legL.rotation.x = -Math.sin(t) * 1; legR.rotation.x = Math.sin(t) * 1;
            } else {
                armL.rotation.x = 0; armR.rotation.x = 0;
                legL.rotation.x = 0; legR.rotation.x = 0;
            }

            velocityY += gravity;
            player.position.y += velocityY;

            // Collision
            canJump = false;
            platforms.forEach(plat => {
                const pTop = plat.position.y + (plat.userData.h / 2);
                const dx = Math.abs(player.position.x - plat.position.x);
                const dz = Math.abs(player.position.z - plat.position.z);
                
                if (dx < (plat.userData.w / 2) + 0.4 && dz < (plat.userData.d / 2) + 0.4) {
                    if (velocityY <= 0 && player.position.y <= pTop + 0.5 && player.position.y >= pTop - 1.0) {
                        player.position.y = pTop;
                        velocityY = 0;
                        canJump = true;
                        if(plat.userData.isCheckpoint) {
                            checkpointPos.set(plat.position.x, pTop + 2, plat.position.z);
                            document.getElementById('status').innerText = "Checkpoint Saved!";
                        }
                        if(plat.userData.isGoal) {
                            gameActive = false;
                            document.exitPointerLock();
                            winScreen.style.display = "flex";
                        }
                    }
                }
            });

            // Hazards
            lasers.forEach(laser => {
                laser.position.x = laser.userData.startX + Math.sin(Date.now() * 0.003 + laser.userData.offset) * laser.userData.range;
                if (player.position.distanceTo(laser.position) < 1.8) {
                    player.position.copy(checkpointPos);
                    velocityY = 0;
                }
            });

            if (keys['Space'] && canJump) { velocityY = 0.48; canJump = false; }
            if (player.position.y < -60) { player.position.copy(checkpointPos); velocityY = 0; }

            // Camera Tracking
            const cDist = 18;
            camera.position.x = player.position.x + Math.sin(yaw) * cDist * Math.cos(pitch);
            camera.position.y = player.position.y + cDist * Math.sin(pitch) + 6;
            camera.position.z = player.position.z + Math.cos(yaw) * cDist * Math.cos(pitch);
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
